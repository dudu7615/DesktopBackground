[project]
name = "desktopbackground"
version = "0.1.0"
description = "电脑时钟桌面"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.12.1",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "pillow>=12.1.1",
    "pydantic>=2.13.4",
    "pyside6>=6.10.2",
    "pywin32>=311",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "auto-py-to-exe>=2.48.1",
    "pyinstaller>=6.19.0",
]
